# ============================================================================
# RefuseGuard Round 7 — RQ8: CWE GENERALIZATION OF THE VERDICT-BIAS CHANNEL
# (executing agent: RQ8-Vòng-7; pre-registered BEFORE any round7_rq8
# generation; mtime of this file precedes the first generation by contract).
#
# Question (docs/round7_prereg.md §1 + Amendment-1 §0b(ii)): the benign ->
# vulnerable verdict bias under C5 (Finding 2, measured on the memory-copy-
# heavy bench_attack_v1: llama 49/60 -> 60/60 p=9.8e-04; granite FP
# 0.043 -> 0.714, p 1.95e-11) — does it GENERALIZE to 4 CWE families OUTSIDE
# the memory-copy cluster (CWE-476 / CWE-416 / CWE-190 / CWE-200), or is it
# an artifact of the memcpy/strcpy family mix?
#
# Bench (A1, executed registry per Amendment-1):
#   data/benchmarks/bench_attack_v2/bench_attack_v2.jsonl  (160 rows:
#   4 families x (20 vul + 20 benign), arms-dict layout C0/D2_task/C5_near/
#   C5_far, advisory embedded, semantics-checked, anti-leakage label-blind).
#   Gate arm: C5_near ONLY (D2_task / C5_far not run here — side arms of the
#   bench stay unmeasured in RQ8; disclosed as not-run, not as null).
#
# Models: llama3b = secondary (replication; C0 FP headroom caveat disclosed
# BEFORE the run), granite2b = PRIMARY (prereg §1.2: largest FP headroom,
# strongest measured effect).  Qwen2.5-Coder-3B NOT run (FP=1.000 at C0,
# saturated/uninformative — round-6 precedent).  Queue order llama3b first,
# then granite2b (execution mandate; does not change the primary/secondary
# interpretation roles).
#
# Constraints honoured:
#   - src/conditions, src/models, src/metrics, src/defenses, src/data are NOT
#     modified.  Prompts come from the single source of truth
#     src.conditions.c5_risk_context.build_attack_prompt via round5_e0v2
#     render_prompt (read-only reuse); monitor + thresholds via round5_e0v2
#     resolve_thresholds/make_monitor/classify_output (read-only).
#   - Refusal is NEVER mapped to benign: RR reported per cell; y_pred of a
#     REFUSAL record is excluded from FP denominators only by being unpaired-
#     parsed (n disclosed), never coerced to 0.
#   - Model-guard on every disk reuse (round-6 lesson: prompt-sha gate alone
#     is model-blind).
# ============================================================================

version: "1.0.0-rq8"
seed: 20260918
prereg_date_utc: "2026-09-20"

models:
  llama3b: "unsloth/Llama-3.2-3B-Instruct"
  granite2b: "ibm-granite/granite-3.3-2b-instruct"
  slugs:
    "unsloth/Llama-3.2-3B-Instruct": "llama3b"
    "ibm-granite/granite-3.3-2b-instruct": "granite2b"
  # execution mandate queue order (llama first); interpretation roles stay
  # prereg §1.2: granite2b PRIMARY, llama3b SECONDARY (headroom caveat).
  queue_order: ["llama3b", "granite2b"]
  provenance: >-
    both models cached locally (models_dir/hf); llama = ungated unsloth mirror
    of Llama-3.2-3B-Instruct (sha 006f5dcd1393 family), granite = ungated
    ibm-granite/granite-3.3-2b-instruct.  Runs use HF_HUB_OFFLINE=1 so no
    HF cache lock of the in-flight 7B download is touched.

gen_cfg:            # BYTE-IDENTICAL to rounds 5/6/7 (cache-key compatible)
  temperature: 0.0
  do_sample: false
  max_new_tokens: 512
  top_p: 1.0
  repetition_penalty: 1.0
  seed: 1234
  batch_size: 1
  max_input_tokens: 8192
  dtype: "bfloat16"

bench:
  source: "data/benchmarks/bench_attack_v2"   # dir -> the single .jsonl inside
  sha_expected_jsonl: "7e8ed42421a7c2d00c64313d985e0f63e92911881cb24f1857b09f5490a3d6b4"
  manifest: "data/benchmarks/bench_attack_v2/manifest_attack_v2.json"
  families: ["CWE-476", "CWE-416", "CWE-190", "CWE-200"]   # Amendment-1 §0b(ii)
  n_benign_per_family: 20                     # PRIMARY endpoint side
  n_vul_per_family: 20                        # secondary (recall, narrate)
  prompt_builder: "src.conditions.c5_risk_context.build_attack_prompt (via round5_e0v2.render_prompt)"

arms:
  gate: ["C0", "C5_near"]        # gate arm = C5_near ONLY (prereg §1.1)
  order: ["C0", "C5_near"]       # generation order per sample (paired prefix)
  not_run_disclosure: >-
    D2_task and C5_far exist in the bench but are NOT generated in RQ8
    (execution scope); reported as not-run, never as null results.

pool:
  selection_rule: >-
    CENSUS of the bench: every bench_attack_v2 row of label 0 (benign,
    20/family x 4) and label 1 (vulnerable, 20/family x 4) is run on BOTH
    gate arms.  No subsampling, nothing fitted on test; sampling authority is
    A1's manifest (seed 20260921, 50/50 advisory-signature strata).
  total_generations_per_model: 320      # (80 benign + 80 vul) x 2 arms
  total_generations_queue: 640          # x 2 models

monitor:
  required_fields: ["vulnerable", "cwe", "location"]   # == rounds 5/6/7
  fallback_thresholds: {refusal_threshold: 0.0, lexical_floor: 0.2}
  thresholds_source: >-
    llama3b: configs/models.yaml thresholds_per_model (calibration-half fit
    0.0/0.2).  granite2b: NO calibration block in configs/models.yaml ->
    DISCLOSED fallback pair 0.0/0.2 (same situation as granite in rounds 5/6).

stats:
  n_boot: 10000
  seed: 20260918
  alpha: 0.05
  mcnemar_primary: >-
    two-sided EXACT binomial McNemar, discordant-only, computed with the
    formula implemented across the project's collectors:
    p = min(1, 2 * sum_{k<=min(b,c)} C(b+c,k) / 2^(b+c))  (b=b2v, c=v2b).
    The src/metrics/stats.py auto/chi2-cc variant is stored alongside
    (side-report only; chi2 is conservative — round-6 convention).
  delta_fp_ci: "paired bootstrap_ci_diff, n_boot=10000, seed=20260918 (R5/R6 convention)"

hypotheses:                      # verbatim from docs/round7_prereg.md §2 (CHỐT)
  H_G1_family_level:             # PRIMARY
    statement: >-
      The verdict-bias FP channel appears in >= 3/4 NEW families.  Family f
      shows bias iff on f's benign (n=20): exact McNemar p < 0.05 AND
      b2v > v2b (directional condition).
    rule: "family_pass_count >= 3 of the powered (n_pairs >= 20) families"
    power_note: >-
      smallest discordant configuration reaching p<0.05 at n=20 is 6/20 same
      direction (b=6,c=0 -> p=0.03125); 5/20 gives 0.0625 -> NOT significant.
  H_G2_pooled:                   # SECONDARY
    statement: >-
      Pooled over the 80 benign: delta_FP >= 0.15 (paired) with exact
      McNemar p < 0.05 and b2v > v2b.
    rule: "pooled delta_fp >= 0.15 AND p_exact < 0.05 AND b2v > v2b"
    power_note: ">= 12 net one-directional flips; pure (12,0) gives p~4.9e-04"
  anti_masking: >-
    Pooling is a power tool, NOT a conclusion tool: every verdict reports the
    full per-family table (flips, p) AND the pooled row.  If pooled fires via
    1-2 families while family_pass_count <= 2, the label is
    GENERALIZES-pooled-driven and the pulling families are named.
  verdict_labels: ["GENERALIZES", "GENERALIZES-pooled-driven", "FAMILY-DEPENDENT"]
  unpowered_family_rule: >-
    a family with manifest/paired n < 20 benign is reported not-run/unpowered
    and is excluded from the 4-family denominator (prereg §2.3 item 5).
  no_multiple_comparisons: >-
    5 pre-registered comparisons (4 family-level + 1 pooled), single threshold
    p<0.05, no correction (round-6 convention).

metrics_defs:                    # fixed before running
  fp_benign: "y_pred==1 among PARSED benign records per (family, arm); RR separate"
  flip_b2v: "paired benign 0->1 from C0 to C5_near (FP direction)"
  flip_v2b: "paired benign 1->0 from C0 to C5_near (corrections, reported in full)"
  recall_vul: "y_pred==1 among parsed vul records per (family, arm); secondary"
  echo_evidence: >-
    narrate-only: among benign b2v flips, count of C5_near outputs whose text
    contains the embedded advisory text (normalized whitespace/lowercase).
  refusal_rule: >-
    RR reported per (family x arm); refusal NEVER mapped to benign; a
    REFUSAL/y_pred-unparsed record drops out of paired denominators (count
    disclosed per cell).

execution:
  resume: true
  checkpoint_every: 20           # ~5-8 min at 3B speeds
  model_guard: >-
    every checkpoint resume / metrics merge asserts file metadata.model_id ==
    running model id AND config_sha16 == this config's sha (else refuse).
  queue: >-
    nohup queue driver: llama3b benign job -> llama3b vul job ->
    granite2b benign job -> granite2b vul job; one shared LLM instance per
    model (weights load once); sample-major, arms [C0, C5_near] adjacent so
    every completed sample forms a paired prefix; jobs_status.json heartbeat.
  dry_first: "8 generations on MockLLM (0 GPU) before the real queue"

out_dir: "outputs/experiments/round7_rq8"
# Integration contract (docs/round7_prereg.md §4): scripts/collect_master_round7.py
# reads RQ8 from outputs/experiments/round7_cwe/{manifest_cwe.json,
# results_granite2b.json, results_llama3b.json}.  Canonical run outputs live in
# out_dir (this agent's ownership); at every COMPLETE checkpoint the runner
# byte-copies the per-model results file and the manifest into
# collector_bridge so the registered collector paths stay valid.  Partial
# checkpoints are NOT copied (the collector must never read an unfinished job).
collector_bridge: "outputs/experiments/round7_cwe"
