# =============================================================================
# Round 3 — E2 (framing) + E3 (contextual stress) + E4 (carrier/position
# ablation, analysis-only) on bench_v1 — agent A1 — PRE-REGISTRATION
# =============================================================================
# Written BEFORE any round-3 E2/E3 generation (2026-09-18, round 3). Samples are
# read DIRECTLY from the materialized benchmark (S_report.md Round-3
# recommendation #3): every variant text was already semantics-gated at build
# time, so no condition re-application happens at run time.
#
# Cache-overlap design: E3's C0 baseline and E2's neutral arm are the SAME
# prompt (task text = row.framing.neutral, func = variants.C0.func), so each
# sample costs 5 generations total, not 6:
#   C0_neutral == E3-C0 (1 gen) | C1_defensive (1) | C2a (1) | C2b (1) | C3 (1)
#   => 60 samples x 5 = 300 generations per model.
# =============================================================================

version: "round3-a1-final"
seed: 20260918
stats_seed: 20260918
n_boot: 10000

models:
  - Qwen/Qwen2.5-Coder-3B-Instruct       # slug: qwen3b
  - unsloth/Llama-3.2-3B-Instruct        # slug: llama3b
  - ibm-granite/granite-3.3-2b-instruct  # slug: granite2b (runs LAST; may be cut for time — disclosed if absent)

bench_source: data/benchmarks/bench_v1/bench_v1.jsonl
bench_sha256: b2e277b2c5233539   # bench_v1_meta.json sha (annotate pass refreshed; full value in bench_v1_meta.json)

sample:
  n: 60                       # 30 vulnerable + 30 benign (balanced label)
  selection_rule: >-
    rows stratified by label; within each label sort by sample_id ascending;
    shuffle with random.Random(seed + 41); take the first 30 per label.
    label=1 rows are section=vulnerable; label=0 rows may be section=benign or
    paired (composition disclosed in outputs metadata).
  seed_offset: 41

prompting:
  system: configs/conditions.yaml prompts.system (whitespace-collapsed)   # shared defensive JSON-schema system
  task_text_neutral: row.framing.neutral      # used by C0_neutral (E2+E3-C0), C2a, C2b, C3
  task_text_defensive: row.framing.defensive  # used by C1_defensive
  user_format: "{task}\n\n```{language}\n{func}\n```\n\nReport your finding as the required JSON object and nothing else."
  language: row.language (bench per-row grammar tag)

conditions:
  e2_arms:
    C0_neutral: {task: framing.neutral, func: variants.C0.func, also_is: E3 C0 baseline}
    C1_defensive: {task: framing.defensive, func: variants.C0.func}
  e3_conditions:
    C2a: {task: framing.neutral, func: variants.C2a.func}
    C2b: {task: framing.neutral, func: variants.C2b.func}
    C3:  {task: framing.neutral, func: variants.C3.func}

monitor:
  required_fields: [vulnerable]
  thresholds:
    Qwen/Qwen2.5-Coder-3B-Instruct: {refusal_threshold: 0.0, lexical_floor: 0.7, source: calibration half fit (round 10 free-text + max_false_refusal=0.10)}
    unsloth/Llama-3.2-3B-Instruct: {refusal_threshold: 0.0, lexical_floor: 0.3, source: calibration half fit (round 10 free-text + max_false_refusal=0.10)}
    ibm-granite/granite-3.3-2b-instruct: {fit_on: round3_e0 granite scoring-probe outputs (in-sample, disclosed); fallback = Qwen/Llama fit (0.0, 0.2) if e0 granite run absent}

gen:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 300
  seed: 1234
  batch_size: 1
  max_input_tokens_default: 8192
  max_input_tokens_overrides:
    ibm-granite/granite-3.3-2b-instruct: 4096

e4:
  mode: analysis_only   # NO new generations; derived from E3 records
  carrier_field: variants.<C>.carrier
  position_field: variants.<C>.position
  confound_field: row.near_far_confound
  near_vs_far_rule: >-
    near-vs-far comparisons use ONLY rows with near_far_confound == false
    (docs/benchmark_v1.md §5 downstream rule); confounded rows are reported
    separately as counts.

stats:
  mcnemar_pairs: [C0_neutral vs C1_defensive, C0_neutral vs C2a, C0_neutral vs C2b, C0_neutral vs C3]
  mcnemar_outcomes: [y_pred verdict (parsed 0/1), refusal indicator]
  siud: usable-coverage(C0_neutral) - usable-coverage(<cond>), paired bootstrap_ci_diff

output_dir: outputs/experiments/round3_e2e3
