# ============================================================================
# EVIDA pilot (round 17) — Evidence-grounded Invariant Verdict Analysis
# FROZEN configuration for the pre-registration
#   RESEARCH_STATE/PREREGISTRATIONS/prereg_EVIDA_..._.md  (freeze 2026-09-30)
# This file is created BEFORE any EVIDA generation (prereg §3 config_hash:
# "PENDING_RUN — tạo trước generation, sha16 ghi run meta").  Arm texts,
# prompts and thresholds are NOT redefined here — they are read-only reuse of
# the frozen upstream machinery (round7_rq8.yaml / packguard_safety.yaml).
# ============================================================================

version: "1.0.0-evida-pilot"
prereg: >-
  RESEARCH_STATE/PREREGISTRATIONS/prereg_EVIDA_Evidence_grounded_Invariant_
  Verdict_Analysis_under_untrusted_context_counterfactual_disagreement_code_
  evidence_adjudication_verify_or_abstain_.md
code_commit_at_freeze: "fb8988ad1ae9ef486856636c6c71129c54672e00"

out_dir: "outputs/experiments/round17_evida"
master_out: "outputs/master/round17_master.json"

models:
  granite2b: "ibm-granite/granite-3.3-2b-instruct"   # PRIMARY (M1 headroom)
  llama3b: "unsloth/Llama-3.2-3B-Instruct"           # DIER focus (M3)
  order: ["granite2b", "llama3b"]
  hf_home: "models_dir/hf"
  device: "mps"
  dtype: "bfloat16"

# S1 prompts: round7_rq8 machinery, byte-identical (stripped func substituted);
# S2 prompts: safety-port machinery with the frozen P2D1/P0 task text.
gen_cfg:
  S1:                       # == configs/round7_rq8.yaml gen_cfg (cache-key compatible)
    temperature: 0.0
    do_sample: false
    max_new_tokens: 512
    top_p: 1.0
    top_k: null
    repetition_penalty: 1.0
    seed: 1234
    batch_size: 1
    max_input_tokens: 8192
    dtype: "bfloat16"
  S2:                       # == configs/packguard_safety.yaml gen_cfg (FROZEN copy)
    temperature: 0.0
    do_sample: false
    max_new_tokens: 384
    top_p: 1.0
    top_k: null
    repetition_penalty: 1.0
    seed: 1234
    batch_size: 1
    max_input_tokens: 4096
    dtype: "bfloat16"

monitor:
  required_fields: ["vulnerable", "cwe", "location"]
  # S1 thresholds: same resolution as round 7 (llama fitted via configs/
  # models.yaml; granite DISCLOSED fallback 0.0/0.2).  S2: safety_port's
  # per-model resolution (granite fallback disclosed per record).

adjudication:
  fallback_tau_path: "outputs/transformer/fallback_threshold.json"  # tau .5480763912200928 (FROZEN, not retuned)
  fallback_config: "configs/train_codebert.yaml"                    # CodeBERT 125M frozen checkpoint
  checker_families: ["CWE-190", "CWE-200", "CWE-416", "CWE-476"]
  checker_selection_rule: >-
    claim.cwe normalized into the 4-family bank, else the sample's registered
    family (S1 only); S2 packages with no banked claim CWE -> UNDECIDABLE ->
    fallback (never a vacuous REFUTE).
  safety_scope_guard: "fallback never on safety-contrast records (M6)"

sources:
  S1:
    bench: "data/benchmarks/bench_attack_v2/bench_attack_v2.jsonl"
    sha256_16: "7e8ed42421a7c2d0"
    results:
      "ibm-granite/granite-3.3-2b-instruct": "outputs/experiments/round7_rq8/results_granite2b.json"
      "unsloth/Llama-3.2-3B-Instruct": "outputs/experiments/round7_rq8/results_llama3b.json"
    prompt_builder: "round5_e0v2.render_prompt (c5.build_attack_prompt, stripped func)"
  S2:
    defense_batch: "outputs/packguard/defense/defense_batch.jsonl"
    sha256_16: "5bc02c99a026246b"
    safety_config: "configs/packguard_safety.yaml"   # sha16 e3e37d636a92a998
    prompt_builder: "safety_port.render_prompt('P2D1_strip', stripped_P0)"
  S3:
    status: "NOT_REALIZED_AT_PILOT"
    reason: >-
      E6 C3 carrier prompt machinery would have to be rebuilt post-freeze
      (drift risk the prereg forbids); qwen replication is outside the pilot
      model roster; no gated comparison touches S3.  E6 stratum reported
      not-evaluable (prereg §1.10 soft-stop semantics).
  S4:
    safety_files:
      qwen: "outputs/experiments/round3_e8/recomputed/recompute_e8_monitor.json"
      llama: "outputs/experiments/round3_e8_llama3b/recomputed/recompute_e8_monitor.json"
    mode: "cache-only (0 new generations)"

stats:
  alpha: 0.05
  n_boot: 10000
  seed: 20260922            # prereg §1.8 analysis/bootstrap seed
  holm_comparisons: 4

gates:
  crr_min: 0.40
  dier_max: 0.05
  precision_floor: 0.5
  uac_floor: 0.95
  mpie_dcrr: 0.15
  stretch_crr: 0.60
  strata_required: 2

dry_run: false
