# PackGuard FL config — round-8 FINAL real runs (agent F, AMENDMENT-1).
# seed 20260922 everywhere; every result row carries meta.mock (must be false
# for these runs; synthetic fixture runs are separate and clearly flagged).
seed: 20260922

data:
  features_dir: outputs/packguard/features   # loader picks the HIGHEST features_v*.jsonl (v2)
  test_fraction: 0.2
  split: group                               # PRIMARY split (AMENDMENT-1); random = secondary
  feature_block: graph

model:
  type: lr            # lr | mlp
  hidden_dim: 32      # mlp only

fl:
  rounds: 15
  local_epochs: 2
  lr: 0.1
  batch_size: 32
  mu_fedprox: 0.01    # FedProx proximal coefficient

secure_agg:
  enabled: true       # pairwise additive-mask SIMULATION (masks cancel at server)

dp:
  enabled: false      # DP ablation runs with a PURPOSEFUL sigma=0.1 (eps~9.7/round)
  sigma: 0.1
  delta: 1.0e-5
  clip: 1.0           # per-client update L2 clip (DP-FedAvg style)

eval:
  primary_comparison: fedavg_vs_centralized   # McNemar + bootstrap on paired correctness
  bootstrap_n: 10000
  bootstrap_seed: 20260922

ablations:
  fl_variants: [fedavg, fedprox, centralized, per_client_only]
  feature_blocks: [graph, tfidf]   # graph features vs code-as-text baseline path
  kb:                              # LLM-KB augmentation on/off
    enabled: false                 # enabled by the final runner once kb_v2 exists
    kb_dir: outputs/packguard/kb

# ---------------------------------------------------------------------------
# Round-9 multi-seed grid (AMENDMENT-3, docs/packguard_prereg.md; agent W1).
# Registered BEFORE execution: seeds fixed, aggregation rule frozen
# (per-seed McNemar + Wilcoxon over the 5 per-seed F1 deltas; n=5 -> exact
# two-sided minimum p = 0.0625, i.e. descriptive support only).
# Primary grid = 5 seeds x 4 methods x 2 feature sets x 2 splits = 80 runs on
# the ecosystem (2-client) partition; the npm_hook 3-client fallback partition
# (ecosystem+hook split of the SAME 603-sample corpus, NOT a new ecosystem)
# runs as a separately-labelled arm. Hyperparameters come from the fl/model/
# secure_agg/dp sections above (unchanged from round 8).
# Run: .venv/bin/python -m packguard.eval --grid
# ---------------------------------------------------------------------------
grid:
  seeds: [20260922, 20260923, 20260924, 20260925, 20260926]
  splits: [group, random]            # group = PRIMARY (AMENDMENT-1), random = secondary
  feature_blocks: [graph, tfidf]     # tfidf fit on TRAIN of each (seed, split)
  methods: [fedavg, fedprox, centralized, per_client_best]
  partitions: [ecosystem]            # PRIMARY client partition
  run_client3: true                  # adds the disclosed npm_hook fallback arm (A3.3)
  text_cache: outputs/packguard/features/text_v2.json
