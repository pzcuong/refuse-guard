# PackGuard LCO — leave-cluster-out robustness (round 13, AMENDMENT-7).
# Registered BEFORE any LCO run; agent W1. Seeds = AMENDMENT-4 set.
# Cluster files are produced by: python -m packguard.clusters --threshold {0.3,0.5}
# PRIMARY threshold = 0.30 (histogram elbow); 0.50 = sensitivity.
# Run: .venv/bin/python -m packguard.lco --config configs/packguard_lco.yaml
seeds: [20260922, 20260923, 20260924, 20260925, 20260926, 20260927, 20260928, 20260929, 20260930, 20260931, 20260932, 20260933, 20260934, 20260935, 20260936, 20260937, 20260938, 20260939, 20260940, 20260941]

features: outputs/packguard/features/features_v2.jsonl
text_cache: outputs/packguard/features/text_v2.json
outdir: outputs/packguard/lco

# ordered: FIRST key = primary threshold (AMENDMENT-7 A7.1)
cluster_files:
  0.3: outputs/packguard/lco/clusters_t030.json
  0.5: outputs/packguard/lco/clusters_t050.json

test_fraction_clusters: 0.2
blocks: [graph, hashing_tfidf, trivial]   # trivial = descriptive third arm
methods: [strong_centralized, fedavg]     # round-11 strong recipe (A5.1/A5.2)
fedavg_rounds: 2                          # fixed point from round 2 (A5.2)
c_grid: [0.01, 0.1, 1.0, 10.0]
